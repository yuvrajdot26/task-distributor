<!DOCTYPE html>
<html>

<head>
    {% load static %}
    <title>Task Distributor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{% static 'css/dashboard.css' %}">

    <!-- Set theme before paint so there's no flash of the wrong mode -->
    <script>
        document.documentElement.setAttribute(
            'data-theme',
            localStorage.getItem('td-theme') || 'light'
        );
    </script>

</head>

<body>

<div class="d-flex">
    {% if user.is_authenticated %}
    <!-- Sidebar -->
    <div class="sidebar text-white p-3">

        <div class="brand mb-4">
            <span class="brand-mark"><i class="bi bi-kanban-fill"></i></span>
            Task Distributor
        </div>

        <div class="nav flex-column">

            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                <i class="bi bi-grid-1x2-fill"></i> Dashboard
            </a>

            <a class="nav-link {% if '/employees' in request.path %}active{% endif %}" href="/employees/">
                <i class="bi bi-people-fill"></i> Employees
            </a>

            <a class="nav-link {% if '/tasks' in request.path %}active{% endif %}" href="/tasks/">
                <i class="bi bi-list-task"></i> Tasks
            </a>

            <a class="nav-link {% if '/history' in request.path %}active{% endif %}" href="/history/">
                <i class="bi bi-clock-history"></i> History
            </a>

            <a class="nav-link {% if '/workload' in request.path %}active{% endif %}" href="/workload/">
                <i class="bi bi-bar-chart-fill"></i> Workload
            </a>

        </div>

        <div class="sidebar-divider"></div>

        {% if user.is_authenticated %}

            <div class="sidebar-user">
                <div class="avatar">{{ user.username|slice:":2"|upper }}</div>
                <div class="flex-grow-1">
                    <div class="sidebar-username">{{ user.username }}</div>
                    <a class="logout-link" href="/logout/">Log out</a>
                </div>
            </div>

        {% else %}

            <a class="nav-link text-success" href="/login/">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </a>

        {% endif %}

    </div>
    {% endif %}
    <!-- Main Content -->
    <div class="flex-grow-1 p-4">

        <div class="topbar d-flex justify-content-end mb-3">
            <button id="themeToggle" class="theme-toggle-btn" title="Toggle dark mode">
                <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
            </button>
        </div>

        {% block content %}
        {% endblock %}

    </div>

</div>

<script>
    const root = document.documentElement;
    const toggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    function setIcon(theme) {
        themeIcon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
    }
    setIcon(root.getAttribute('data-theme'));

    toggleBtn.addEventListener('click', () => {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem('td-theme', next);
        setIcon(next);
        // let any page-level chart script know the theme changed
        document.dispatchEvent(new CustomEvent('td-theme-change', { detail: next }));
    });
</script>


</body>

</html>
