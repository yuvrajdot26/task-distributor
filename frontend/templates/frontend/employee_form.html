{% extends "frontend/base.html" %}

{% block content %}

<h2 class="page-title">Add Employee</h2>

<div class="card form-card">
<div class="card-body">

<form method="post">

    {% csrf_token %}

    <div class="mb-3">
        <label>Name</label>
        <input
            type="text"
            name="full_name"
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input
            type="email"
            name="email"
            class="form-control"
            required>
    </div>

    <div class="mb-3">

        <label>Skill</label>

        <select
            name="skills"
            class="form-control">

            <option value="BACKEND">Backend</option>
            <option value="FRONTEND">Frontend</option>
            <option value="TESTING">Testing</option>
            <option value="DEVOPS">DevOps</option>

        </select>

    </div>

    <div class="mb-3">

        <label>Experience</label>

        <select
            name="experience_level"
            class="form-control">

            <option value="Junior">Junior</option>
            <option value="Mid">Mid</option>
            <option value="Senior">Senior</option>

        </select>

    </div>

    <button
        type="submit"
        class="btn btn-primary">

        Save Employee

    </button>

</form>

</div>
</div>

{% endblock %}
