{% extends "frontend/base.html" %}

{% block content %}

<h2 class="page-title">Add Task</h2>

<div class="card form-card">
<div class="card-body">

<form method="post">

    {% csrf_token %}

    <div class="mb-3">
        <label>Title</label>
        <input
            type="text"
            name="title"
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label>Description</label>
        <textarea
            type="text"
            name="description"
            class="form-control"
            required></textarea>
    </div>


    <div class="mb-3">
        <label>Deadline</label>
        <input
            type="datetime-local"
            name="deadline"
            class="form-control"
        >
    </div>

    <button
        type="submit"
        class="btn btn-primary">

        Save Task

    </button>

</form>

</div>
</div>

{% endblock %}
